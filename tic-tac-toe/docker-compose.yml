# Connect postgres client with:
# - from the container: psql  -U dbuser -d db
# - from the host:
#   > docker exec -it db-tests bash
#   > psql  -U dbuser -d db
#
services:
  db-tests:
    container_name: db-tests
    build:
      context: ./repository-jdbi
      dockerfile: ./tests/Dockerfile-db-test
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=changeit
      - POSTGRES_DB=db
    ports:
      - 5432:5432